<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit I · International Finance Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EC;--surface:#F8FBF9;--surface2:#EFF5F1;--ink:#12261F;--muted:#55675F;--line:#C6D5CC;
  --a:#3B3FD8;--a-soft:#E2E3FA;--b:#0C7F65;--b-soft:#D3EEE5;--c:#B97B05;--c-soft:#F7EAC6;--d:#C23B48;--d-soft:#F8DCDF;
  --shadow:0 1px 2px rgba(18,38,31,.08),0 8px 24px rgba(18,38,31,.06);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1513;--surface:#13201D;--surface2:#182925;--ink:#E3EEE8;--muted:#96AAA1;--line:#264038;
    --a:#9094FF;--a-soft:#212559;--b:#4FD3AE;--b-soft:#12392F;--c:#F0B84A;--c-soft:#46370F;--d:#FF7F8B;--d-soft:#4A1E25;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1513;--surface:#13201D;--surface2:#182925;--ink:#E3EEE8;--muted:#96AAA1;--line:#264038;
  --a:#9094FF;--a-soft:#212559;--b:#4FD3AE;--b-soft:#12392F;--c:#F0B84A;--c-soft:#46370F;--d:#FF7F8B;--d-soft:#4A1E25;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.62}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}

/* ---------- route rail ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;padding:26px 20px 24px 24px;border-right:1px solid var(--line);background:var(--surface2);font-family:var(--sans)}
.brand h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.12;margin:0 0 4px;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:14px}
.overall{margin:18px 0 6px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--b);border-radius:99px;transition:width .5s}
.route{list-style:none;margin:20px 0 0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.route li{position:relative}
.stop{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:8px 8px 8px 0;border-radius:10px}
.stop:hover{background:color-mix(in srgb,var(--a) 7%,transparent)}
.dot{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);position:relative;z-index:1}
.stop.part .dot{border-color:var(--c);color:var(--c)}
.stop.full .dot{background:var(--b);border-color:var(--b);color:#fff}
.stop.cur .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 28%,transparent);border-color:var(--a)}
.stop.cur.full .dot{border-color:var(--b)}
.stop .tt{font-size:14.5px;font-weight:600;line-height:1.3;padding-top:3px}
.stop.cur .tt{color:var(--a)}
.stop small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.railfoot{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.ghost{font-family:var(--sans);font-size:13px;font-weight:600;background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:99px}
.ghost:hover{border-color:var(--a);color:var(--a)}

/* ---------- main ---------- */
.mobbar{display:none}
.main{min-width:0;padding:30px clamp(18px,4vw,56px) 60px;max-width:1040px;width:100%}
.lhead h2{font-size:clamp(30px,4.2vw,46px);line-height:1.08;margin:0 0 8px;font-weight:600;letter-spacing:-.015em}
.lhead p{margin:0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:6px;margin:24px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto;font-family:var(--sans)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--a);border-bottom-color:var(--a)}
.tab .tick{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;background:var(--line)}
.tab .tick.on{background:var(--b)}
.panel{min-height:300px}
.panel h3{font-family:var(--sans);font-size:21px;margin:30px 0 8px;letter-spacing:-.005em}
.panel h3:first-child{margin-top:0}
.panel p{margin:0 0 14px;max-width:68ch}
.panel ul,.panel ol{max-width:68ch;padding-left:22px;margin:0 0 16px}
.panel li{margin-bottom:6px}
.panel b,.panel strong{font-weight:600}
.term{background:var(--a-soft);padding:0 5px;border-radius:5px}
.callout{border-left:4px solid var(--c);background:var(--c-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0;max-width:68ch;font-size:17px}
.callout.good{border-color:var(--b);background:var(--b-soft)}
.callout.bad{border-color:var(--d);background:var(--d-soft)}
.callout.info{border-color:var(--a);background:var(--a-soft)}
.tw{overflow-x:auto;max-width:100%;margin:12px 0 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-family:var(--sans);font-size:14.5px;line-height:1.45}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:700}
tr:last-child td{border-bottom:0}
.ctaRow{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--sans)}
.btn{background:var(--a);color:#fff;border:0;padding:11px 20px;border-radius:99px;font-weight:600;font-size:15px;font-family:var(--sans)}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{border-color:var(--a);color:var(--a)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--b)}

/* ---------- video-style stage ---------- */
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.stage svg{display:block;width:100%;height:auto;font-family:var(--sans)}
.capbox{margin:14px 0 8px;min-height:92px}
.capbox h3{margin:0 0 4px!important;font-size:19px!important}
.capbox p{margin:0;color:var(--muted);max-width:none}
.seg{display:flex;gap:6px;margin:6px 0 12px}
.seg button{flex:1;height:8px;border-radius:99px;border:0;background:var(--line);padding:0;position:relative;overflow:hidden}
.seg button.done{background:var(--b)}
.seg button.act::after{content:"";position:absolute;inset:0;background:var(--a);transform-origin:left;transform:scaleX(0);animation:fill var(--dur,7s) linear forwards}
.seg.paused button.act::after{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.ctl{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--sans);align-items:center}
.ctl .ghost{min-width:44px}
.sceneno{margin-left:auto;font-size:13px;color:var(--muted);font-family:var(--sans)}

/* svg scene elements */
.it{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.it{transform-box:fill-box;transform-origin:center}
.bar{transform-box:fill-box;transform-origin:bottom;opacity:0;animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{from{opacity:1;transform:scaleY(.02)}to{opacity:1;transform:scaleY(1)}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:dash .8s ease-out forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.coin{animation:travel 2.4s ease-in-out infinite;opacity:0}
@keyframes travel{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.fa{fill:var(--a-soft);stroke:var(--a)}.fb{fill:var(--b-soft);stroke:var(--b)}.fc{fill:var(--c-soft);stroke:var(--c)}.fd{fill:var(--d-soft);stroke:var(--d)}.fn{fill:var(--surface2);stroke:var(--line)}
.sa{stroke:var(--a)}.sb{stroke:var(--b)}.sc{stroke:var(--c)}.sd{stroke:var(--d)}.sn{stroke:var(--muted)}
.ta{fill:var(--a)}.tb{fill:var(--b)}.tc{fill:var(--c)}.td{fill:var(--d)}.tn{fill:var(--ink)}.tm{fill:var(--muted)}
.band{opacity:.55}
.solidA{fill:var(--a)}.solidB{fill:var(--b)}.solidC{fill:var(--c)}.solidD{fill:var(--d)}.solidN{fill:var(--muted)}

/* ---------- examples ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:0 0 18px;box-shadow:var(--shadow)}
.ex h3{margin:0 0 6px!important}
.ex .sc{color:var(--muted);margin:0 0 10px}
.ex ol{margin-bottom:12px}
.ex .res{background:var(--b-soft);border-radius:10px;padding:10px 14px;font-family:var(--sans);font-size:15px;font-weight:600;max-width:none;margin:0}

/* ---------- quiz ---------- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);max-width:760px}
.qmeta{display:flex;justify-content:space-between;font-family:var(--sans);font-size:13.5px;color:var(--muted);margin-bottom:10px}
.qcard h3{font-family:var(--serif)!important;font-weight:500;font-size:22px!important;line-height:1.35;margin:0 0 16px!important}
.opts{display:grid;gap:10px}
.opt{text-align:left;font-family:var(--sans);font-size:16px;background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--a)}
.opt.ok{border-color:var(--b);background:var(--b-soft)}
.opt.ok .l{background:var(--b);border-color:var(--b);color:#fff}
.opt.no{border-color:var(--d);background:var(--d-soft)}
.opt.no .l{background:var(--d);border-color:var(--d);color:#fff}
.opt[disabled]{cursor:default}
.fb2{margin-top:16px;padding:12px 16px;border-radius:12px;font-size:16.5px}
.fb2.ok{background:var(--b-soft)}.fb2.no{background:var(--d-soft)}
.fb2 b{font-family:var(--sans)}
.result{max-width:760px}
.score{font-family:var(--sans);font-size:54px;font-weight:700;line-height:1;margin:8px 0}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;font-size:16.5px}
.rev b{font-family:var(--sans)}

/* ---------- revise ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:6px 0 22px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:16.5px}
.rcard b{font-family:var(--sans);display:block;margin-bottom:4px}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 10px;max-width:760px}
details.qa summary{cursor:pointer;font-weight:600;font-family:var(--sans);font-size:16px}
details.qa p{margin:10px 0 0}
.kp li::marker{color:var(--b)}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--sans)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .mobbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface2);border-bottom:1px solid var(--line);padding:10px 16px;font-family:var(--sans)}
  .mobbar b{font-size:15px}
  .rail{display:none;position:fixed;inset:0;height:auto;z-index:30;border-right:0;padding-top:calc(26px + env(safe-area-inset-top,0px))}
  .rail.open{display:block}
  body{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  .it,.bar,.draw{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}
  .coin{animation:none!important;opacity:1}
  .seg button.act::after{animation:none!important;transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="mobbar"><b id="mobTitle">International Finance</b><button class="ghost" id="menuBtn" aria-expanded="false" aria-controls="rail">Lessons</button></div>
<div class="app">
  <aside class="rail" id="rail" aria-label="Lesson route">
    <div class="brand"><h1>International Finance</h1><p>Unit I · International Financial Management</p></div>
    <div class="overall"><span id="ovLabel">Progress</span><span id="ovPct">0%</span></div>
    <div class="meter"><i id="ovBar"></i></div>
    <ol class="route" id="route"></ol>
    <div class="railfoot">
      <button class="ghost" id="themeBtn">Switch theme</button>
      <button class="ghost" id="resetBtn">Reset progress</button>
      <button class="ghost" id="closeRail">Close</button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <header class="lhead"><h2 id="lTitle"></h2><p id="lSub"></p></header>
    <div class="tabs" role="tablist" id="tabs"></div>
    <section class="panel" id="panel" role="tabpanel" aria-live="polite"></section>
    <nav class="lnav" id="lnav"></nav>
  </main>
</div>
<script>
/* =====================================================================
   LESSON DATA (pure data – no DOM access). Scene item types:
   ['band',x,y,w,h,tone]            ['box',x,y,w,h,'a|b',tone,fs]
   ['t',x,y,'a|b',fs,anchor,tone]   ['arr',x1,y1,x2,y2,label,tone]
   ['coin',x1,y1,x2,y2,symbol,tone] ['bar',x,baseY,w,h,label,tone,value]
   ['line',x1,y1,x2,y2,tone,dashed]
   ===================================================================== */
const LESSONS = [];
/* grid helper: lays out labelled boxes in rows/cols */
function G(labels, cols, x0, y0, w, h, gx, gy, tones, fs) {
  return labels.map((l, i) => ['box', x0 + (i % cols) * (w + gx), y0 + Math.floor(i / cols) * (h + gy), w, h, l,
    Array.isArray(tones) ? tones[i % tones.length] : tones, fs || 13.5]);
}

/* ------------------------------------------------------------------ 1 */
LESSONS.push({
  id: 'overview', icon: '1', title: 'International Finance: An Overview',
  sub: 'What international finance is, what it studies, and why every globally active business depends on it.',
  learn: [
    { h: 'Meaning and scope', html: `
      <p><span class="term">International finance</span> is the branch of finance that deals with financial transactions between two or more countries. It studies how money, foreign exchange, investment and financial decisions move across national borders, and how firms, banks and governments manage the resulting opportunities and risks.</p>
      <p>Domestic finance assumes one currency, one legal system and one set of financial markets. International finance removes all three assumptions. Once a transaction crosses a border, at least one party deals in a foreign currency, is subject to a foreign legal and tax regime, and faces a different political and economic environment.</p>
      <div class="callout info"><b>In simple words:</b> international finance explains how money moves between countries and how businesses manage financial decisions in the global economy.</div>` },
    { h: 'Main features', html: `
      <ul>
        <li><b>Foreign exchange.</b> Conversion of one country's currency into another. Every cross-border payment depends on an exchange rate, the price of one currency in terms of another.</li>
        <li><b>International trade.</b> The financial side of exports and imports: invoicing currency, credit terms, payment instruments and settlement.</li>
        <li><b>International investment.</b> Investing money in foreign countries, through direct investment in factories and subsidiaries or through foreign shares and bonds.</li>
        <li><b>Exchange-rate fluctuations.</b> Changes in currency values alter the home-currency value of foreign revenues, costs, assets and liabilities, so they directly change profits.</li>
        <li><b>International financial markets.</b> Markets in which currencies, bonds, shares and other financial assets are traded across borders.</li>
        <li><b>Political and economic risk.</b> Changes in government policy, inflation, interest rates or political stability in other countries can change the value of a foreign business or claim.</li>
      </ul>` },
    { h: 'Importance of international finance', html: `
      <ol>
        <li>Helps companies <b>expand their business globally</b> by financing foreign operations.</li>
        <li>Makes <b>international trade and payments</b> easier through exchange and settlement mechanisms.</li>
        <li>Provides access to <b>foreign capital</b> and investment opportunities when domestic funds are scarce or costly.</li>
        <li>Helps <b>manage foreign-exchange risk</b> through tools such as forwards and options.</li>
        <li>Supports <b>economic growth and cooperation</b> between countries.</li>
        <li>Helps <b>multinational corporations</b> manage funds across different countries.</li>
      </ol>
      <div class="callout">Why it is examinable: almost every later topic in this unit (the monetary system, balance of payments, trade barriers) is a closer look at one of these six features.</div>` },
    { h: 'Classifying international financial activity', html: `
      <div class="tw"><table>
        <tr><th>Activity</th><th>What happens</th><th>Typical risk</th></tr>
        <tr><td>Trade finance</td><td>Exporter or importer settles goods and services in a foreign currency</td><td>Exchange-rate and credit risk</td></tr>
        <tr><td>Foreign investment</td><td>Firm builds a plant abroad or buys foreign securities</td><td>Political, economic and exchange risk</td></tr>
        <tr><td>Foreign borrowing</td><td>Firm raises loans or bonds in another currency or market</td><td>Exchange-rate and interest-rate risk</td></tr>
        <tr><td>Hedging and treasury</td><td>Firm uses financial contracts to reduce currency exposure</td><td>Cost of hedging, basis and counterparty risk</td></tr>
      </table></div>` }
  ],
  examples: [
    { t: 'Importing machinery from Germany', s: 'An Indian company buys machinery invoiced at €200,000. The exchange rate (illustrative) moves from ₹90 per euro when the order is placed to ₹95 per euro when payment is due.',
      steps: ['Cost at order date = 200,000 × ₹90 = ₹1,80,00,000 (₹1.8 crore).', 'Cost at payment date = 200,000 × ₹95 = ₹1,90,00,000 (₹1.9 crore).', 'Difference = ₹10,00,000.'],
      r: 'A weaker rupee raised the rupee cost by ₹10 lakh although the euro price never changed.' },
    { t: 'An IT exporter invoices in dollars', s: 'An Indian software firm bills a US client $1,000,000. Assume the rupee is ₹83 per dollar at invoicing and strengthens to ₹80 per dollar at receipt.',
      steps: ['Expected rupee revenue = 1,000,000 × 83 = ₹8,30,00,000.', 'Actual rupee revenue = 1,000,000 × 80 = ₹8,00,00,000.', 'Shortfall = ₹30,00,000.'],
      r: 'A stronger home currency reduces the rupee value of foreign revenue; the exporter loses ₹30 lakh from currency movement alone.' },
    { t: 'Same event, two viewpoints', s: 'Use the two cases above to see that exchange-rate movements do not hurt everyone equally.',
      steps: ['A weaker rupee hurts importers (higher rupee cost) but helps exporters (more rupees per dollar).', 'A stronger rupee helps importers but hurts exporters.', 'A firm that both imports and exports in the same currency is partly naturally hedged.'],
      r: 'Direction of exposure, not just size, determines how a firm should manage currency risk.' }
  ],
  scenes: [
    { title: 'Money crosses a border', cap: 'An Indian importer orders machinery from a German exporter. The price is in euros, so rupees must be converted through the foreign-exchange market before payment.',
      items: [['band', 20, 30, 290, 280, 'a'], ['band', 390, 30, 290, 280, 'c'],
        ['t', 165, 62, 'India (₹)', 18, 'middle', 'a'], ['t', 535, 62, 'Germany (€)', 18, 'middle', 'c'],
        ['box', 50, 95, 230, 60, 'Indian importer|needs machinery', 'a', 15], ['box', 420, 95, 230, 60, 'German exporter|invoice: €200,000', 'c', 15],
        ['arr', 280, 125, 420, 125, 'order', 'n'],
        ['box', 270, 225, 160, 56, 'Forex market|₹ → €', 'b', 15],
        ['coin', 150, 175, 290, 235, '₹', 'a'], ['coin', 440, 250, 550, 175, '€', 'c']] },
    { title: 'The exchange rate moves', cap: 'The euro price of the machine never changes, but when the rupee weakens from ₹90 to ₹95 per euro, the rupee cost rises by ₹10 lakh.',
      items: [['t', 350, 38, 'Rupee cost of the same €200,000 machine (₹ lakh)', 15, 'middle', 'n'],
        ['bar', 130, 290, 130, 180, 'At ₹90 per €', 'a', '₹180 L'], ['bar', 300, 290, 130, 190, 'At ₹95 per €', 'd', '₹190 L'],
        ['t', 560, 170, 'Extra cost|₹10 lakh', 18, 'middle', 'd'], ['t', 560, 215, 'same machine, same euro price', 13, 'middle', 'm']] },

    { h: 'Stage 1: The gold standard', html: `
      <p>Under the <span class="term">gold standard</span>, each currency was linked to a fixed quantity of gold. Because every currency had a gold value, exchange rates between currencies (the <i>mint parity</i>) were relatively stable.</p>
      <ul>
        <li><b>Strength:</b> exchange-rate stability and an automatic adjustment mechanism. A deficit country lost gold, its money supply fell, prices fell and exports became more competitive (the price-specie-flow mechanism).</li>
        <li><b>Weakness:</b> countries had limited flexibility in monetary policy, because money supply was tied to gold holdings; growth in the economy depended on gold supply.</li>
      </ul>` },
    { h: 'Stage 2: Bretton Woods (1944 to early 1970s)', html: `
      <p>Countries maintained <b>fixed but adjustable exchange rates linked to the US dollar</b>, while the dollar was convertible into gold for foreign monetary authorities at <b>$35 per ounce</b>. The IMF and World Bank were created under this arrangement.</p>
      <ul>
        <li>Each member declared a par value in dollars and kept its exchange rate within a narrow band around it (typically ±1%) by central-bank intervention.</li>
        <li>Par values could be changed only to correct a "fundamental disequilibrium".</li>
        <li><b>Why it failed:</b> the dollar's gold convertibility became hard to sustain as US deficits grew, confidence weakened, and in 1971 the United States suspended dollar-gold convertibility. The system broke down in the early 1970s.</li>

      </table></div>
      <h3>Double-entry logic</h3>
      <p>Every transaction is recorded twice. Receipts from the rest of the world (exports, inflows) are <b>credits</b>; payments (imports, outflows) are <b>debits</b>. Because each transaction has two sides, the complete BoP always balances.</p>` },

        <li>Helps identify external financing needs.</li>

/* =====================================================================
   ENGINE: state, rendering, scene player, quiz
   ===================================================================== */
const KEY = 'ifm-unit1-studio-v1';
const TABS = [['learn', 'Learn'], ['watch', 'Watch'], ['examples', 'Examples'], ['quiz', 'Quiz'], ['revise', 'Revise']];
const SCENE_MS = 7500;
const MOCK = { id: 'mock', icon: '★', title: 'Unit I mock test', sub: 'Twelve mixed questions drawn from all nine topics. A fresh set every attempt.', mock: true };

let state = loadState();
const quizRun = {};            // in-memory quiz progress per lesson id
let player = { i: 0, playing: true, timer: null };

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object' && s.done) return { cur: s.cur || 0, tab: s.tab || 'learn', done: s.done, best: s.best || {} };
  } catch (e) { /* storage unavailable or empty */ }
  return { cur: 0, tab: 'learn', done: {}, best: {} };
}
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function allItems() { return LESSONS.concat([MOCK]); }
function curLesson() { return allItems()[state.cur] || LESSONS[0]; }
function isDone(id, tab) { return !!(state.done[id] && state.done[id][tab]); }
function setDone(id, tab, v) { state.done[id] = state.done[id] || {}; state.done[id][tab] = v !== false; saveState(); }
function lessonCount(id) { return TABS.filter((t) => isDone(id, t[0])).length; }

/* ---------- chrome: rail, header, tabs ---------- */
function renderRail() {
  const items = allItems();
  $('route').innerHTML = items.map((L, i) => {
    let cls = 'stop', sub = '';
    if (L.mock) {
      const b = state.best.mock;
      sub = b == null ? 'Test yourself' : 'Best score ' + b + '/12';
      if (b != null && b >= 8) cls += ' full';
    } else {
      const n = lessonCount(L.id);
      sub = n + ' of 5 sections';
      if (n === 5) cls += ' full'; else if (n > 0) cls += ' part';
    }
    if (i === state.cur) cls += ' cur';
    return '<li><button class="' + cls + '" data-act="go" data-i="' + i + '"' + (i === state.cur ? ' aria-current="step"' : '') + '><span class="dot">' +
      (cls.indexOf('full') > -1 ? '✓' : esc(L.icon)) + '</span><span class="tt">' + esc(L.title) + '<small>' + sub + '</small></span></button></li>';
  }).join('');
  const total = LESSONS.length * 5;
  const got = LESSONS.reduce((a, L) => a + lessonCount(L.id), 0);
  const pct = Math.round(got / total * 100);
  $('ovPct').textContent = pct + '%';
  $('ovLabel').textContent = got + ' of ' + total + ' sections done';
  $('ovBar').style.width = pct + '%';
}
function renderHead() {
  const L = curLesson();
  $('lTitle').textContent = L.title;
  $('lSub').textContent = L.sub;
  $('mobTitle').textContent = L.mock ? 'Mock test' : 'Topic ' + L.icon + ' of ' + LESSONS.length;
  document.title = L.title + ' · Unit I International Finance';
}
function renderTabs() {
  const L = curLesson();
  if (L.mock) { $('tabs').innerHTML = ''; $('tabs').style.display = 'none'; return; }
  $('tabs').style.display = '';
  $('tabs').innerHTML = TABS.map((t) => '<button class="tab" role="tab" data-act="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) +
    '">' + t[1] + '<span class="tick' + (isDone(L.id, t[0]) ? ' on' : '') + '"></span></button>').join('');
}
function renderNav() {
  const items = allItems();
  const p = state.cur > 0 ? '<button class="btn alt" data-act="go" data-i="' + (state.cur - 1) + '">Previous: ' + esc(items[state.cur - 1].title) + '</button>' : '<span></span>';
  const n = state.cur < items.length - 1 ? '<button class="btn" data-act="go" data-i="' + (state.cur + 1) + '">Next: ' + esc(items[state.cur + 1].title) + '</button>' : '<span></span>';
  $('lnav').innerHTML = p + n;
}
function updateChrome() { renderRail(); renderTabs(); }

/* ---------- navigation ---------- */
function go(i, tab) {
  stopPlayer();
  const max = allItems().length - 1;
  state.cur = Math.max(0, Math.min(max, i));
  state.tab = tab || 'learn';
  saveState();
  closeRail();
  renderAll();
  $('main').scrollIntoView({ block: 'start' });
  try { $('main').focus({ preventScroll: true }); } catch (e) { /* ignore */ }
}
function switchTab(t) {
  stopPlayer();
  state.tab = t; saveState();
  renderTabs(); renderPanel(); renderRail();
}
function renderAll() { renderRail(); renderHead(); renderTabs(); renderPanel(); renderNav(); }
function renderPanel() {
  const L = curLesson(), p = $('panel');
  if (L.mock) { p.innerHTML = ''; viewQuiz(L, true); return; }
  if (state.tab === 'learn') viewLearn(L);
  else if (state.tab === 'watch') viewWatch(L);
  else if (state.tab === 'examples') viewExamples(L);
  else if (state.tab === 'quiz') viewQuiz(L, false);
  else viewRevise(L);
}
function nextTabOf(t) { const i = TABS.findIndex((x) => x[0] === t); return TABS[Math.min(i + 1, TABS.length - 1)][0]; }
function doneButton(L, tab, label) {
  const on = isDone(L.id, tab);
  return '<div class="ctaRow"><button class="btn" data-act="markdone" data-tab="' + tab + '">' + (on ? 'Marked as done. Continue' : label) + '</button>' +
    (on ? '<button class="btn alt" data-act="unmark" data-tab="' + tab + '">Undo</button><span class="badge">Section complete</span>' : '') + '</div>';
}

/* ---------- Learn / Examples / Revise ---------- */
function viewLearn(L) {
  $('panel').innerHTML = L.learn.map((s) => '<h3>' + esc(s.h) + '</h3>' + s.html).join('') + doneButton(L, 'learn', 'Mark as read and watch the lesson');
}
function viewExamples(L) {
  $('panel').innerHTML = L.examples.map((e, i) => '<article class="ex"><h3>Example ' + (i + 1) + ': ' + esc(e.t) + '</h3><p class="sc">' + esc(e.s) +
    '</p><ol>' + e.steps.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ol><p class="res">' + esc(e.r) + '</p></article>').join('') +
    doneButton(L, 'examples', 'Mark examples as studied');
}
function viewRevise(L) {
  const r = L.revise;
  $('panel').innerHTML = '<h3>Key points</h3><ul class="kp">' + r.points.map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul>' +
    '<div class="rgrid"><div class="rcard"><b>Exam tip</b>' + esc(r.tip) + '</div><div class="rcard"><b>Memory trick</b>' + esc(r.memory) + '</div></div>' +
    '<h3>Likely exam questions</h3>' + r.qs.map((q) => '<details class="qa"><summary>' + esc(q.q) + '</summary><p>' + esc(q.a) + '</p></details>').join('') +
    doneButton(L, 'revise', 'Mark revision as done');
}

/* ---------- scene renderer ---------- */
const TONE = { a: 'a', b: 'b', c: 'c', d: 'd', n: 'n', m: 'n' };
function lines(txt, x, y, fs, cls, anchor, lh) {
  const parts = String(txt).split('|'), lhh = lh || fs * 1.22, y0 = y - (parts.length - 1) * lhh / 2;
  return '<text class="' + cls + '" x="' + x + '" y="' + y0 + '" font-size="' + fs + '" text-anchor="' + (anchor || 'middle') + '" dominant-baseline="central" font-weight="600">' +
    parts.map((p, i) => '<tspan x="' + x + '" dy="' + (i ? lhh : 0) + '">' + esc(p) + '</tspan>').join('') + '</text>';
}
function renderScene(sc) {
  let out = '<svg viewBox="0 0 700 340" role="img" aria-label="' + esc(sc.title) + '" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' + ['a', 'b', 'c', 'd', 'n'].map((k) => '<marker id="ah' + k + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="solid' + k.toUpperCase() + '"/></marker>').join('') + '</defs>';
  sc.items.forEach((it, i) => {
    const k = it[0], d = (i * 0.28).toFixed(2) + 's';
    const st = 'style="animation-delay:' + d + '"';
    if (k === 'band') {
      out += '<rect class="it band f' + TONE[it[5]] + '" ' + st + ' x="' + it[1] + '" y="' + it[2] + '" width="' + it[3] + '" height="' + it[4] + '" rx="16" stroke-width="1.5"/>';
    } else if (k === 'box') {
      const t = TONE[it[6]], fs = it[7] || 14;
      out += '<g class="it" ' + st + '><rect class="f' + t + '" x="' + it[1] + '" y="' + it[2] + '" width="' + it[3] + '" height="' + it[4] + '" rx="12" stroke-width="2"/>' +
        lines(it[5], it[1] + it[3] / 2, it[2] + it[4] / 2, fs, 'tn', 'middle') + '</g>';
    } else if (k === 't') {
      out += '<g class="it" ' + st + '>' + lines(it[3], it[1], it[2], it[4] || 14, 't' + (TONE[it[6]] === 'n' ? (it[6] === 'm' ? 'm' : 'n') : TONE[it[6]]), it[5] || 'middle') + '</g>';
    } else if (k === 'arr') {
      const t = TONE[it[6]], len = Math.round(Math.hypot(it[3] - it[1], it[4] - it[2]));
      out += '<g class="it" ' + st + '><line class="s' + (t === 'n' ? 'n' : t) + ' draw" style="--len:' + len + ';animation-delay:' + d + '" x1="' + it[1] + '" y1="' + it[2] + '" x2="' + it[3] + '" y2="' + it[4] +
        '" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah' + t + ')"/>';
      if (it[5]) out += lines(it[5], (it[1] + it[3]) / 2, (it[2] + it[4]) / 2 - 12, 12.5, 'tm', 'middle');
      out += '</g>';
    } else if (k === 'line') {
      out += '<line class="it s' + TONE[it[5]] + '" ' + st + ' x1="' + it[1] + '" y1="' + it[2] + '" x2="' + it[3] + '" y2="' + it[4] + '" stroke-width="2.5"' + (it[6] ? ' stroke-dasharray="7 6"' : '') + '/>';
    } else if (k === 'coin') {
      const t = TONE[it[6]];
      out += '<g class="coin" style="--dx:' + (it[3] - it[1]) + 'px;--dy:' + (it[4] - it[2]) + 'px;animation-delay:' + (0.8 + i * 0.28).toFixed(2) + 's"><circle class="solid' + t.toUpperCase() + '" cx="' + it[1] + '" cy="' + it[2] + '" r="15"/>' +
        '<text x="' + it[1] + '" y="' + it[2] + '" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#fff">' + esc(it[5]) + '</text></g>';
    } else if (k === 'bar') {
      const t = TONE[it[6]], x = it[1], base = it[2], w = it[3], h = it[4];
      out += '<g><rect class="bar solid' + t.toUpperCase() + '" style="animation-delay:' + d + '" x="' + x + '" y="' + (base - h) + '" width="' + w + '" height="' + h + '" rx="8"/></g>' +
        '<g class="it" ' + st + '>' + lines(it[5], x + w / 2, base + 22, 13, 'tn', 'middle') + (it[7] ? lines(it[7], x + w / 2, base - h - 14, 15, 't' + t, 'middle') : '') + '</g>';
    }
  });
  return out + '</svg>';
}

/* ---------- Watch: video-style player ---------- */
function viewWatch(L) {
  const n = L.scenes.length;
  player = { i: 0, playing: true, timer: null };
  $('panel').innerHTML = '<div class="stage" id="stage"></div>' +
    '<div class="capbox"><h3 id="cTitle"></h3><p id="cText"></p></div>' +
    '<div class="seg" id="seg">' + L.scenes.map((s, i) => '<button data-act="scene" data-i="' + i + '" aria-label="Scene ' + (i + 1) + ': ' + esc(s.title) + '"></button>').join('') + '</div>' +
    '<div class="ctl"><button class="ghost" data-act="sprev" aria-label="Previous scene">◀ Prev</button><button class="ghost" data-act="splay" id="playBtn">Pause</button>' +
    '<button class="ghost" data-act="snext" aria-label="Next scene">Next ▶</button><button class="ghost" data-act="sreplay">Replay</button><span class="sceneno" id="sNo"></span></div>' +
    '<div class="callout info" style="margin-top:18px">Watch all ' + n + ' scenes to complete this section. Tap a bar to jump between scenes.</div>';
  showScene(L, 0);
}
function showScene(L, i) {
  clearTimeout(player.timer);
  const n = L.scenes.length;
  player.i = Math.max(0, Math.min(n - 1, i));
  const sc = L.scenes[player.i];
  $('stage').innerHTML = renderScene(sc);
  $('cTitle').textContent = sc.title;
  $('cText').textContent = sc.cap;
  $('sNo').textContent = 'Scene ' + (player.i + 1) + ' of ' + n;
  const seg = $('seg');
  seg.classList.toggle('paused', !player.playing);
  Array.prototype.forEach.call(seg.children, (b, k) => {
    b.className = k < player.i ? 'done' : (k === player.i ? 'act' : '');
    if (k === player.i) b.style.setProperty('--dur', SCENE_MS + 'ms');
  });
  $('playBtn').textContent = player.playing ? 'Pause' : 'Play';
  if (player.i === n - 1) { if (!isDone(L.id, 'watch')) { setDone(L.id, 'watch'); updateChrome(); } }
  if (player.playing && player.i < n - 1) {
    player.timer = setTimeout(() => showScene(L, player.i + 1), SCENE_MS);
  } else if (player.i === n - 1) {
    player.playing = false; $('playBtn').textContent = 'Play'; seg.classList.add('paused');
    Array.prototype.forEach.call(seg.children, (b, k) => { b.className = 'done'; });
  }
}
function stopPlayer() { clearTimeout(player.timer); player.playing = false; }

/* ---------- Quiz ---------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function newRun(L, isMock) {
  let qs;
  if (isMock) {
    qs = shuffle(LESSONS.reduce((acc, l) => acc.concat(l.quiz.map((q) => Object.assign({ from: l.title }, q))), [])).slice(0, 12);
  } else qs = L.quiz.map((q) => q);
  quizRun[L.id] = { qs: qs, i: 0, score: 0, picked: null, wrong: [], finished: false };
}
function viewQuiz(L, isMock) {
  if (!quizRun[L.id]) newRun(L, isMock);
  const r = quizRun[L.id], p = $('panel');
  if (r.finished) {
    const total = r.qs.length, pass = isMock ? 8 : 3;
    const msg = r.score === total ? 'Perfect score.' : r.score >= pass ? 'Good work. You have passed this quiz.' : 'Review the Learn and Revise tabs, then try again.';
    p.innerHTML = '<div class="result"><h3>Quiz complete</h3><div class="score">' + r.score + ' / ' + total + '</div><p>' + msg + ' Best so far: <b>' + (state.best[L.id] == null ? r.score : state.best[L.id]) + ' / ' + total + '</b>.</p>' +
      (r.wrong.length ? '<h3>Questions to revisit</h3>' + r.wrong.map((w) => '<div class="rev"><b>' + esc(w.q) + '</b><br>Correct answer: ' + esc(w.ans) + '<br>' + esc(w.e) + (w.from ? '<br><i>Topic: ' + esc(w.from) + '</i>' : '') + '</div>').join('') : '') +
      '<div class="ctaRow"><button class="btn" data-act="retry">' + (isMock ? 'Start a new mock test' : 'Retry quiz') + '</button>' +
      (!isMock ? '<button class="btn alt" data-act="tab" data-tab="revise">Go to revision notes</button>' : '') + '</div></div>';
    return;
  }
  const q = r.qs[r.i], letters = ['A', 'B', 'C', 'D', 'E'], answered = r.picked !== null;
  p.innerHTML = '<div class="qcard"><div class="qmeta"><span>Question ' + (r.i + 1) + ' of ' + r.qs.length + '</span><span>Score ' + r.score + '</span></div>' +
    '<h3>' + esc(q.q) + '</h3><div class="opts" role="group" aria-label="Answer choices">' +
    q.o.map((o, k) => {
      let c = 'opt';
      if (answered) { if (k === q.a) c += ' ok'; else if (k === r.picked) c += ' no'; }
      return '<button class="' + c + '" data-act="pick" data-k="' + k + '"' + (answered ? ' disabled' : '') + '><span class="l">' + letters[k] + '</span><span>' + esc(o) + '</span></button>';
    }).join('') + '</div>' +
    (answered ? '<div class="fb2 ' + (r.picked === q.a ? 'ok' : 'no') + '"><b>' + (r.picked === q.a ? 'Correct.' : 'Not quite.') + '</b> ' + esc(q.e) + '</div>' +
      '<div class="ctaRow"><button class="btn" data-act="qnext">' + (r.i === r.qs.length - 1 ? 'See result' : 'Next question') + '</button></div>' : '') + '</div>';
}
function pickAnswer(k) {
  const L = curLesson(), r = quizRun[L.id];
  if (!r || r.picked !== null || r.finished) return;
  const q = r.qs[r.i];
  r.picked = k;
  if (k === q.a) r.score++; else r.wrong.push({ q: q.q, ans: q.o[q.a], e: q.e, from: q.from });
  viewQuiz(L, !!L.mock);
}
function nextQuestion() {
  const L = curLesson(), r = quizRun[L.id];
  if (!r || r.picked === null) return;
  if (r.i < r.qs.length - 1) { r.i++; r.picked = null; }
  else {
    r.finished = true;
    if (state.best[L.id] == null || r.score > state.best[L.id]) state.best[L.id] = r.score;
    if (!L.mock && r.score >= 3) setDone(L.id, 'quiz');
    saveState(); updateChrome();
  }
  viewQuiz(L, !!L.mock);
}

/* ---------- side drawer, theme, reset ---------- */
function openRail() { $('rail').classList.add('open'); $('menuBtn').setAttribute('aria-expanded', 'true'); }
function closeRail() { $('rail').classList.remove('open'); $('menuBtn').setAttribute('aria-expanded', 'false'); }
function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(KEY + '-theme', next); } catch (e) { /* ignore */ }
}

/* ---------- event delegation ---------- */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act'), L = curLesson();
  if (act === 'go') go(parseInt(el.getAttribute('data-i'), 10));
  else if (act === 'tab') { const t = el.getAttribute('data-tab'); if (L.mock) return; switchTab(t); }
  else if (act === 'markdone') { const t = el.getAttribute('data-tab'); setDone(L.id, t); updateChrome(); if (!(t === 'revise')) switchTab(nextTabOf(t)); else { renderPanel(); } }
  else if (act === 'unmark') { setDone(L.id, el.getAttribute('data-tab'), false); updateChrome(); renderPanel(); }
  else if (act === 'pick') pickAnswer(parseInt(el.getAttribute('data-k'), 10));
  else if (act === 'qnext') nextQuestion();
  else if (act === 'retry') { newRun(L, !!L.mock); viewQuiz(L, !!L.mock); }
  else if (act === 'scene') { player.playing = false; showScene(L, parseInt(el.getAttribute('data-i'), 10)); }
  else if (act === 'snext') { showScene(L, player.i + 1); }
  else if (act === 'sprev') { showScene(L, player.i - 1); }
  else if (act === 'splay') {
    if (player.i === L.scenes.length - 1 && !player.playing) { player.playing = true; showScene(L, 0); }
    else { player.playing = !player.playing; showScene(L, player.i); }
  }
  else if (act === 'sreplay') { player.playing = true; showScene(L, 0); }
});
$('menuBtn').addEventListener('click', () => { $('rail').classList.contains('open') ? closeRail() : openRail(); });
$('closeRail').addEventListener('click', closeRail);
$('themeBtn').addEventListener('click', toggleTheme);
$('resetBtn').addEventListener('click', () => {
  if (!window.confirm('Reset all progress and quiz scores?')) return;
  state = { cur: 0, tab: 'learn', done: {}, best: {} };
  Object.keys(quizRun).forEach((k) => delete quizRun[k]);
  saveState(); renderAll();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeRail(); });

/* ---------- boot ---------- */
(function boot() {
  try { const t = localStorage.getItem(KEY + '-theme'); if (t) applyTheme(t); } catch (e) { /* ignore */ }
  if (state.cur >= allItems().length) state.cur = 0;
  renderAll();
})();
</script>
